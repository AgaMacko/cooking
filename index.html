/* Layout: kitchen planner — meal chain on the left, live shopping list docked on the right (stacked on phones). Basil green + tomato red. */
:root {
  --bg: #f4f6f2;
  --surface: #ffffff;
  --sunk: #eaeee7;
  --ink: #1b221d;
  --muted: #5a665e;
  --line: #d9dfd6;
  --accent: #2e6b3d;
  --accent-ink: #ffffff;
  --accent-soft: #dcebdf;
  --tomato: #b8402c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #192019; --sunk: #222a23; --ink: #e6ece5; --muted: #9ba79e;
    --line: #2d362f; --accent: #7cc48c; --accent-ink: #0f1a12; --accent-soft: #233a29; --tomato: #ef8a74;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #192019; --sunk: #222a23; --ink: #e6ece5; --muted: #9ba79e;
  --line: #2d362f; --accent: #7cc48c; --accent-ink: #0f1a12; --accent-soft: #233a29; --tomato: #ef8a74;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }
header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
header.top .intro { max-width: 62ch; display: grid; gap: 8px; min-width: 0; }
header.top p { margin: 0; color: var(--muted); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.04em; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.cols { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr) 380px; } }

section.block { display: grid; gap: 14px; min-width: 0; }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.note { color: var(--muted); font-size: 0.9rem; margin: 0; max-width: 70ch; }

/* matrix */
.matrix-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table.matrix { border-collapse: collapse; font-size: 0.85rem; min-width: 100%; }
table.matrix th, table.matrix td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.matrix tr:last-child td, table.matrix tr:last-child th { border-bottom: 0; }
table.matrix thead th { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; position: relative; }
table.matrix thead th.extra { color: var(--tomato); }
table.matrix tbody th { text-align: left; font-weight: 500; position: sticky; left: 0; background: var(--surface); }
table.matrix td .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
table.matrix td.off .dot { background: transparent; }
table.matrix td.dim .dot { opacity: 0.35; }
table.matrix tr.hl th, table.matrix tr.hl td { background: var(--accent-soft); }

/* meals */
.group-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.meals { display: grid; gap: 12px; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.meal.on { border-color: var(--accent); }
.meal .photo { display: block; width: calc(100% + 32px); max-width: none; margin: -14px -16px 0; height: clamp(160px, 28vw, 240px); object-fit: cover; border-radius: 11px 11px 0 0; background: var(--sunk); }
.meal-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.num { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-variant-numeric: tabular-nums; }
.meal.on .num { background: var(--accent); color: var(--accent-ink); }
.meal.extra .num { color: var(--tomato); }
.meal.extra.on .num { background: var(--tomato); color: var(--surface); }
.meta { color: var(--muted); font-size: 0.85rem; display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 2px; }
.pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pick label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
.pick input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--sunk); width: 30px; height: 30px; cursor: pointer; font-weight: 600; }
.stepper span { min-width: 64px; text-align: center; font-size: 0.85rem; font-variant-numeric: tabular-nums; padding: 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.8rem; padding: 2px 10px; border-radius: 999px; background: var(--sunk); border: 1px solid transparent; cursor: default; }
.chip.shared { background: var(--accent-soft); }
.chip.hl { border-color: var(--accent); }
.links { display: grid; gap: 2px; font-size: 0.85rem; color: var(--muted); }
.links b { color: var(--ink); font-weight: 600; }
details.recipe { border-top: 1px solid var(--line); padding-top: 8px; }
details.recipe summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.recipe summary::-webkit-details-marker { display: none; }
details.recipe summary::before { content: "▸"; transition: transform .15s; }
details.recipe[open] summary::before { transform: rotate(90deg); }
.recipe-body { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); margin-top: 12px; }
@media (min-width: 720px) { .recipe-body { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); } }
.recipe-body h4 { margin: 0 0 6px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.recipe-body ul, .recipe-body ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.recipe-body ul { list-style: none; padding-left: 0; }
.recipe-body ul li { display: flex; gap: 8px; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.recipe-body ul li .q { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.recipe-body ul li.grp { border: 0; font-weight: 600; margin-top: 6px; color: var(--tomato); }
.recipe-body .n { display: block; font-size: 0.8rem; color: var(--muted); }
.recipe-body ol li { padding-left: 4px; }
.recipe-body .extra-notes { display: grid; gap: 4px; margin-top: 12px; font-size: 0.9rem; }
.src { font-size: 0.85rem; }
.credit { font-size: 0.85rem; color: var(--muted); }
.credit a { font-weight: 600; }
header.top p.credit { color: var(--ink); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; }
footer.foot { max-width: 1240px; margin: 32px auto 0; padding-top: 16px; border-top: 1px solid var(--line); }
.meal .photo-wrap { position: relative; margin: -14px -16px 0; }
.meal .photo-wrap .photo { margin: 0; width: 100%; }
.meal .photo-wrap figcaption { position: absolute; right: 8px; bottom: 8px; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: rgb(0 0 0 / 0.55); color: #fff; }

/* shopping list */
aside.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
@media (min-width: 1000px) { aside.list { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; } }
.summary { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat { display: grid; gap: 4px; }
.cat h3 { font-size: 0.75rem; font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; padding: 5px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.item input { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--accent); }
.item .nm { font-weight: 500; }
.item .qt { font-variant-numeric: tabular-nums; }
.item .sub { font-size: 0.78rem; color: var(--muted); }
.item.done .nm, .item.done .qt { text-decoration: line-through; color: var(--muted); }
.empty { color: var(--muted); font-size: 0.9rem; padding: 12px; background: var(--sunk); border-radius: 8px; }
.status { font-size: 0.85rem; color: var(--accent); min-height: 1.3em; }
textarea#copyfallback { width: 100%; min-height: 160px; font: 0.85rem/1.4 var(--font-body); background: var(--sunk); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }

.jump { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5; box-shadow: 0 4px 14px rgb(0 0 0 / 0.18); border-radius: 999px; padding: 10px 16px; }
@media (min-width: 1000px) { .jump { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 560px) {
  .meal-head { grid-template-columns: auto minmax(0, 1fr); }
  .pick { grid-column: 1 / -1; justify-content: flex-start; }
}
</style>

      "Heat about 1 cm of oil in a large pan. Drop in spoonfuls of batter and fry over medium heat for about 1½ minutes per side until golden.",
      "Drain on kitchen paper and dust with icing sugar."],
  },
  serve: {
    pl: ["Zużyje jabłka, które zostaną po surówce."],
    de: ["Verbraucht die Äpfel, die vom Rotkohlsalat übrig bleiben."],
    en: ["Uses up the apples left over from the slaw."],
  },
},
];
R.forEach((r, i) => r.no = i + 1);
const MAINS = R.filter(r => r.type === "main" || r.type === "soup");
const EXTRAS = R.filter(r => !MAINS.includes(r));

/* ---------- state ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("lancuch:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("lancuch:" + k, JSON.stringify(v)); } catch (e) {} },
};
let lang = store.get("lang", "pl");
if (!UI[lang]) lang = "pl";
const sel = store.get("sel", {});
R.forEach(r => { if (!sel[r.id]) sel[r.id] = { on: MAINS.includes(r), p: r.serv }; });
let done = store.get("done", {});

/* ---------- formatting ---------- */
const FR = [[0, ""], [0.25, "¼"], [0.33, "⅓"], [0.5, "½"], [0.67, "⅔"], [0.75, "¾"], [1, ""]];
function nice(x) {
  if (x >= 20) return String(Math.round(x));
  let w = Math.floor(x), f = x - w, best = FR[0];
  for (const c of FR) if (Math.abs(c[0] - f) < Math.abs(best[0] - f)) best = c;
  if (best[0] === 1) { w += 1; best = FR[0]; }
  if (!w && !best[1]) return x > 0 ? (lang === "en" ? "0.1" : "0,1") : "0";
  return (w ? String(w) : "") + best[1];
}
function metric(x) {
  const v = x >= 50 ? Math.round(x / 5) * 5 : Math.round(x);
  return String(v);
}
function plForm(n, forms) {
  if (forms.length === 1) return forms[0];
  if (lang === "pl") {
    if (!Number.isInteger(n)) return forms[1];
    if (n === 1) return forms[0];
    const t = n % 10, h = n % 100;
    return (t >= 2 && t <= 4 && !(h >= 12 && h <= 14)) ? forms[1] : forms[2];
  }
  return n === 1 ? forms[0] : forms[1];
}
function roundCount(x) { return Math.round(x * 4) / 4; }
function unitText(q, u) {
  const forms = UNITS[u][lang];
  if (u === "g" || u === "ml") {
    if (u === "g" && q >= 1000) return (Math.round(q / 100) / 10).toString().replace(".", lang === "en" ? "." : ",") + " kg";
    if (u === "ml" && q >= 1000) return (Math.round(q / 100) / 10).toString().replace(".", lang === "en" ? "." : ",") + " l";
    return metric(q) + " " + u;
  }
  if (u === "cm") return metric(q) + " cm";
  const r = roundCount(q);
  const word = plForm(r, forms);
  return (nice(r) + (word ? " " + word : "")).trim();
}
function spoons(ml) {
  let tb = Math.floor(ml / 15 + 1e-9);
  let tsp = Math.round(((ml - tb * 15) / 5) * 4) / 4;
  if (tsp >= 3) { tb += 1; tsp = 0; }
  const parts = [];
  if (tb) parts.push(unitText(tb, "tbsp"));
  if (tsp) parts.push(unitText(tsp, "tsp"));
  return parts.join(" + ") || unitText(0.25, "tsp");
}

/* sum a list of {q,u} for one ingredient into a display string */
function sumQty(list) {
  const t = UI[lang];
  const qs = list.filter(x => x.q != null);
  const hasTaste = list.some(x => x.q == null);
  const out = [];
  const units = [...new Set(qs.map(x => x.u))];
  let vol = 0, mass = 0, volUnits = [];
  const other = {};
  for (const x of qs) {
    const U = UNITS[x.u];
    if (U.d === "v") { vol += x.q * U.f; volUnits.push(x.u); }
    else if (U.d === "m") mass += x.q * U.f;
    else other[x.u] = (other[x.u] || 0) + x.q;
  }
  let volMl = vol;
  if (mass) out.push(unitText(mass, "g"));
  if (vol) {
    const vu = [...new Set(volUnits)];
    if (vu.length === 1 && vu[0] !== "tbsp" && vu[0] !== "tsp") out.push(unitText(vol / UNITS[vu[0]].f, vu[0]));
    else if (vol >= 100) out.push(unitText(vol, "ml"));
    else out.push(spoons(vol));
  }
  for (const u of Object.keys(other)) out.push(unitText(other[u], u));
  if (hasTaste) out.push(t.toTaste);
  return { text: out.join(" + "), volMl, other, mass };
}
function hintText(id, s) {
  const h = HINTS[id];
  if (!h) return "";
  let amount = 0;
  if (id === "coconut" || id === "lemon_juice") amount = s.volMl;
  if (id === "garlic") amount = s.other.clove || 0;
  if (!amount) return "";
  const n = Math.ceil(amount / h.per - 0.05);
  if (id === "coconut") return `≈ ${n} × ${UNITS.can[lang][0]} ${h.label[lang]}`.replace(UNITS.can[lang][0], plForm(n, UNITS.can[lang]));
  return `≈ ${n} ${h.label[lang]}`;
}

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ingName = id => I[id][{ pl: 0, de: 1, en: 2 }[lang]];

function servLabel(r, p) {
  const forms = r.unitServ === "pieces" ? UI[lang].pieces : UI[lang].servings;
  return p + " " + plForm(p, forms);
}

function renderMatrix() {
  const tok = Object.keys(TOKENS);
  let h = "<thead><tr><th></th>";
  for (const r of R) h += `<th class="${MAINS.includes(r) ? "" : "extra"}" title="${esc(r.name[lang])}">${r.no}</th>`;
  h += "</tr></thead><tbody>";
  for (const k of tok) {
    h += `<tr data-tok="${k}"><th>${esc(TOKENS[k][lang])}</th>`;
    for (const r of R) {
      const has = r.tokens.includes(k);
      h += `<td class="${has ? "" : "off"} ${MAINS.includes(r) ? "" : "dim"}"><span class="dot" ${has ? `aria-label="${esc(r.name[lang])}"` : 'aria-hidden="true"'}></span></td>`;
    }
    h += "</tr>";
  }
  $("#matrix").innerHTML = h + "</tbody>";
}

function linkLine(label, other, shared) {
  if (!other || !shared.length) return "";
  return `<div>${esc(label)} <b>${other.no}</b>: ${shared.map(k => esc(TOKENS[k][lang])).join(", ")}</div>`;
}

function renderMeal(r, idx, arr) {
  const t = UI[lang], s = sel[r.id], m = s.p / r.serv;
  const prev = arr[idx - 1], next = arr[idx + 1];
  const isMain = MAINS.includes(r);
  const sharedWith = k => R.some(o => o !== r && o.tokens.includes(k));
  const chips = r.tokens.map(k => `<span class="chip ${sharedWith(k) ? "shared" : ""}" data-tok="${k}" tabindex="0">${esc(TOKENS[k][lang])}</span>`).join("");
  const links = isMain
    ? linkLine(t.fromPrev, prev, prev ? r.tokens.filter(k => prev.tokens.includes(k)) : []) +
      linkLine(t.toNext, next, next ? r.tokens.filter(k => next.tokens.includes(k)) : [])
    : "";
  let ings = "";
  for (const [id, q, u, note] of r.ing) {
    if (id[0] === "#") { ings += `<li class="grp">${esc(t.grp[id.slice(1)])}</li>`; continue; }
    const qty = q == null ? t.toTaste : sumQty([{ q: q * m, u }]).text;
    ings += `<li><span>${esc(ingName(id))}${note ? `<span class="n">${esc(note[lang])}</span>` : ""}</span><span class="q">${esc(qty)}</span></li>`;
  }
  const steps = r.steps[lang].map(x => `<li>${esc(x)}</li>`).join("");
  const extra = (title, obj) => obj ? `<div class="extra-notes"><h4>${esc(title)}</h4>${obj[lang].map(x => `<div>${esc(x)}</div>`).join("")}</div>` : "";
  const minus = r.unitServ === "pieces" ? 5 : 1;
  return `<article class="meal ${s.on ? "on" : ""} ${isMain ? "" : "extra"}" data-id="${r.id}">
    ${r.img ? `<figure class="photo-wrap"><img class="photo" src="${r.img}" alt="${esc(r.name[lang])}" loading="lazy"><figcaption>${esc(t.photo)}: kwestiasmaku.com</figcaption></figure>` : ""}
    <div class="meal-head">
      <div class="num" aria-hidden="true">${r.no}</div>
      <div style="min-width:0">
        <h3>${esc(r.name[lang])}</h3>
        <div class="meta"><span>${esc(t.type[r.type])}</span><span>${esc(r.time[lang])}</span></div>
      </div>
      <div class="pick">
        <div class="stepper" role="group" aria-label="${esc(servLabel(r, s.p))}">
          <button type="button" data-act="minus" data-step="${minus}" aria-label="−">−</button>
          <span>${esc(servLabel(r, s.p))}</span>
          <button type="button" data-act="plus" data-step="${minus}" aria-label="+">+</button>
        </div>
        <label><input type="checkbox" id="pick-${r.id}" data-act="toggle" ${s.on ? "checked" : ""}> ${esc(t.onList)}</label>
      </div>
    </div>
    <div class="chips">${chips}</div>
    ${links ? `<div class="links">${links}</div>` : ""}
    <details class="recipe" id="rec-${r.id}">
      <summary>${esc(t.recipe)}</summary>
      <div class="recipe-body">
        <div><h4>${esc(t.ingredients)} · ${esc(servLabel(r, s.p))}</h4><ul>${ings}</ul></div>
        <div><h4>${esc(t.steps)}</h4><ol>${steps}</ol>${extra(t.tips, r.tips)}${extra(t.serve, r.serve)}
          <p class="src"><a href="${r.src}" target="_blank" rel="noopener">${esc(t.source)} ↗</a></p></div>
      </div>
    </details>
  </article>`;
}

function renderMeals() {
  const openIds = [...document.querySelectorAll("details.recipe[open]")].map(d => d.id);
  $("#mains").innerHTML = MAINS.map(renderMeal).join("");
  $("#extras").innerHTML = EXTRAS.map((r, i, a) => renderMeal(r, i, a)).join("");
  openIds.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
}

function buildList() {
  const agg = {};
  let dishes = 0;
  for (const r of R) {
    const s = sel[r.id];
    if (!s.on) continue;
    dishes++;
    const m = s.p / r.serv;
    for (const [id, q, u] of r.ing) {
      if (id[0] === "#") continue;
      (agg[id] = agg[id] || { items: [], used: new Set() });
      agg[id].items.push({ q: q == null ? null : q * m, u });
      agg[id].used.add(r.no);
    }
  }
  return { agg, dishes };
}

function renderList() {
  const t = UI[lang];
  const { agg, dishes } = buildList();
  const portions = R.filter(r => sel[r.id].on && r.unitServ !== "pieces").reduce((a, r) => a + sel[r.id].p, 0);
  $("#summary").textContent = dishes ? t.summary(dishes, portions + " " + plForm(portions, t.servings)) : "";
  if (!dishes) { $("#listbody").innerHTML = `<div class="empty">${esc(t.empty)}</div>`; return; }
  let h = "";
  for (const c of CAT_ORDER) {
    const ids = Object.keys(agg).filter(id => I[id][3] === c).sort((a, b) => ingName(a).localeCompare(ingName(b), lang));
    if (!ids.length) continue;
    h += `<div class="cat"><h3>${esc(t.cats[c])}</h3>`;
    for (const id of ids) {
      const s = sumQty(agg[id].items);
      const hint = hintText(id, s);
      const used = [...agg[id].used].sort((a, b) => a - b).join(", ");
      h += `<label class="item ${done[id] ? "done" : ""}" for="buy-${id}">
        <input type="checkbox" id="buy-${id}" data-buy="${id}" ${done[id] ? "checked" : ""}>
        <span><span class="nm">${esc(ingName(id))}</span> — <span class="qt">${esc(s.text)}</span>${hint ? ` <span class="sub">(${esc(hint)})</span>` : ""}
        <span class="sub" style="display:block">${esc(t.usedIn)}: ${used}</span></span>
      </label>`;
    }
    h += "</div>";
  }
  $("#listbody").innerHTML = h;
}

function listAsText() {
  const t = UI[lang];
  const { agg } = buildList();
  const lines = [t.list.toUpperCase(), ""];
  for (const c of CAT_ORDER) {
    const ids = Object.keys(agg).filter(id => I[id][3] === c).sort((a, b) => ingName(a).localeCompare(ingName(b), lang));
    if (!ids.length) continue;
    lines.push(t.cats[c] + ":");
    for (const id of ids) {
      const s = sumQty(agg[id].items), hint = hintText(id, s);
      lines.push(`${done[id] ? "[x]" : "[ ]"} ${ingName(id)} — ${s.text}${hint ? " (" + hint + ")" : ""}`);
    }
    lines.push("");
  }
  return lines.join("\n").trim();
}

function renderStatic() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  $("#t-eyebrow").textContent = t.eyebrow;
  $("#t-title").textContent = t.title;
  $("#t-sub").textContent = t.sub;
  const KS = '<a href="https://www.kwestiasmaku.com/" target="_blank" rel="noopener">www.kwestiasmaku.com</a>';
  $("#t-credit").innerHTML = `${esc(t.credit)} ${KS}.`;
  $("#t-foot").innerHTML = `${esc(t.foot)} ${KS}. ${esc(t.footNote)}`;
  $("#t-matrix").textContent = t.matrix;
  $("#t-matrix-note").textContent = t.matrixNote;
  $("#t-mains").textContent = t.mains;
  $("#t-extras").textContent = t.extras;
  $("#b-all").textContent = t.all;
  $("#b-none").textContent = t.none;
  $("#t-list").textContent = t.list;
  $("#b-copy").textContent = t.copy;
  $("#b-reset").textContent = t.reset;
  $("#jump").textContent = t.jump + " ↓";
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

function renderAll() { renderStatic(); renderMatrix(); renderMeals(); renderList(); $("#status").textContent = ""; }
function save() { store.set("sel", sel); store.set("done", done); }

/* ---------- events ---------- */
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  lang = b.dataset.lang; store.set("lang", lang); renderAll();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const card = b.closest(".meal"), r = R.find(x => x.id === card.dataset.id), s = sel[r.id];
  const step = Number(b.dataset.step || 1);
  if (b.dataset.act === "plus") s.p = Math.min(s.p + step, r.unitServ === "pieces" ? 60 : 20);
  else if (b.dataset.act === "minus") s.p = Math.max(s.p - step, step);
  else if (b.dataset.act === "toggle") s.on = b.checked;
  else return;
  save(); renderMeals(); renderList();
});
$("#listbody").addEventListener("change", e => {
  const id = e.target.dataset.buy;
  if (!id) return;
  if (e.target.checked) done[id] = true; else delete done[id];
  save();
  e.target.closest(".item").classList.toggle("done", e.target.checked);
});
$("#b-all").addEventListener("click", () => { MAINS.forEach(r => sel[r.id].on = true); save(); renderMeals(); renderList(); });
$("#b-none").addEventListener("click", () => { R.forEach(r => sel[r.id].on = false); save(); renderMeals(); renderList(); });
$("#b-reset").addEventListener("click", () => { done = {}; save(); renderList(); });
$("#b-copy").addEventListener("click", () => {
  const text = listAsText(), st = $("#status");
  const fallback = () => {
    st.textContent = UI[lang].copyFail;
    let ta = document.getElementById("copyfallback");
    if (!ta) { ta = document.createElement("textarea"); ta.id = "copyfallback"; ta.readOnly = true; st.after(ta); }
    ta.value = text; ta.focus(); ta.select();
  };
  try {
    navigator.clipboard.writeText(text).then(() => { st.textContent = UI[lang].copied; const ta = document.getElementById("copyfallback"); if (ta) ta.remove(); }, fallback);
  } catch (err) { fallback(); }
});
/* highlight a link ingredient across chips and the matrix */
function hl(tok) {
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("hl", tok && c.dataset.tok === tok));
  document.querySelectorAll("#matrix tr[data-tok]").forEach(tr => tr.classList.toggle("hl", tok && tr.dataset.tok === tok));
}
document.addEventListener("mouseover", e => { const c = e.target.closest(".chip, #matrix tr[data-tok]"); hl(c ? c.dataset.tok : null); });
document.addEventListener("focusin", e => { const c = e.target.closest(".chip"); hl(c ? c.dataset.tok : null); });

renderAll();
</script>
